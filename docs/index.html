<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>민법4 OX 퀴즈</title>
<meta name="description" content="주차별 민법 OX 문제를 풀고 바로 정답과 해설을 확인하세요.">
<meta property="og:title" content="민법4 OX 퀴즈">
<meta property="og:description" content="주차별 민법 OX 문제 · 정답과 해설 바로 확인">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%236B7BFF'/%3E%3Ctext x='32' y='42' font-size='26' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3EOX%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="root">
<header class="top">
  <a class="brand" href="#">
    <div><h1>민법4 <span class="o">O</span><span class="x">X</span> 퀴즈</h1><p class="tagline">🤍정민 수민 다현 성근 유찬 화이팅🤍</p></div>
  </a>
</header>

<section id="homeView" class="home">
  <a class="studylink" href="https://docs.google.com/document/d/18cR2ElGbfytdR8ZhqjwmuFmO0gPbz-RGdqhai5lokAE/edit?tab=t.dgdio6vtfx0" target="_blank" rel="noopener">
    <span class="sl-icon" aria-hidden="true">📒</span>
    <span class="sl-text"><b>스터디 바로가기</b><small>구글 문서에서 스터디 자료 보기</small></span>
    <span class="sl-arrow" aria-hidden="true">↗</span>
  </a>
  <h2 class="home-title">문제 풀기</h2>
  <div class="wgrid" id="weekGrid"><p class="empty" id="homeEmpty">문제를 불러오는 중…</p></div>
</section>

<section id="quizView" hidden>
  <div class="quiztop">
    <a class="btn back" href="#">← 주차 선택</a>
    <div class="weeks" id="weekList"></div>
  </div>
  <div class="weekhead"><h2 id="weekTitle"></h2><div class="score" id="score"></div></div>
  <div class="dots" id="dots"></div>
  <article class="card" id="card" hidden>
    <div class="qmeta" id="qmeta"></div>
    <p class="qtext" id="qtext"></p>
    <div class="ox">
      <button type="button" class="oxbtn" id="btnO"><span class="g">○</span><span class="l">맞다</span></button>
      <button type="button" class="oxbtn" id="btnX"><span class="g">×</span><span class="l">틀리다</span></button>
    </div>
    <div class="result" id="result" hidden>
      <div class="expl">
        <h3>해설 <span class="ans-chip" id="ansChip"></span></h3>
        <p id="expl"></p>
        <p class="basis" id="basis" hidden></p>
      </div>
    </div>
    <div class="nav">
      <button type="button" class="btn" id="prev">이전</button>
      <button type="button" class="btn ghost" id="retry">이 주차 다시 풀기</button>
      <button type="button" class="btn primary" id="next">다음 문제</button>
    </div>
  </article>
  <p class="empty" id="empty" hidden>아직 등록된 문제가 없어요.</p>
  <p class="hint">키보드: <kbd>O</kbd> <kbd>X</kbd> 로 답하고 <kbd>←</kbd> <kbd>→</kbd> 로 이동</p>
</section>
</div>
<script src="quiz.js"></script>
</body>
</html>
