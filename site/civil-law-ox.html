<title>민법 OX 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style id="app-style">
:root{
  --bg:#F3F4EF;--surface:#FFFFFF;--ink:#1B2124;--muted:#5E676B;--line:#DADDD5;
  --accent:#26407F;--accent-ink:#FFFFFF;--accent-soft:#E4E9F5;
  --good:#1D7348;--good-soft:#E1F1E7;--bad:#B4382E;--bad-soft:#F8E3E0;
  --serif:"Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121517;--surface:#1A1F22;--ink:#E8EAE6;--muted:#9AA3A6;--line:#2C3337;
    --accent:#8FA8EC;--accent-ink:#0F1522;--accent-soft:#1F2A45;
    --good:#5BC48A;--good-soft:#15301F;--bad:#EE8177;--bad-soft:#3A1C19;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121517;--surface:#1A1F22;--ink:#E8EAE6;--muted:#9AA3A6;--line:#2C3337;
  --accent:#8FA8EC;--accent-ink:#0F1522;--accent-soft:#1F2A45;
  --good:#5BC48A;--good-soft:#15301F;--bad:#EE8177;--bad-soft:#3A1C19;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
#root{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 64px;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.seal{width:44px;height:44px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-family:var(--serif);font-weight:800;font-size:24px;border-radius:6px;transform:rotate(-4deg)}
.brand h1{margin:0;font-family:var(--serif);font-size:24px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.brand p{margin:0;color:var(--muted);font-size:13px}
.modes{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.modes button{border:0;background:none;padding:6px 14px;border-radius:999px;font-size:14px;color:var(--muted)}
.modes button.on{background:var(--ink);color:var(--bg);font-weight:600}

.weeks{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.wk{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;display:flex;flex-direction:column;align-items:flex-start;line-height:1.3}
.wk b{font-size:14px}
.wk small{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.wk.on{border-color:var(--accent);background:var(--accent-soft)}
.wk.on b{color:var(--accent)}

.weekhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.weekhead h2{margin:0;font-family:var(--serif);font-size:20px;font-weight:800;text-wrap:balance}
.score{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.score b{color:var(--ink)}

.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);padding:0}
.dot.right{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:700}
.dot.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:700}
.dot.cur{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:20px}
.qmeta{font-size:12.5px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.qtext{margin:0;font-family:var(--serif);font-size:21px;font-weight:700;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.oxbtn{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:14px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:border-color .15s,background .15s,transform .1s}
.oxbtn .g{font-size:52px;line-height:1;font-weight:400}
.oxbtn .l{font-size:13px;color:var(--muted)}
.oxbtn:hover:not(:disabled){border-color:var(--accent)}
.oxbtn:active:not(:disabled){transform:scale(.98)}
.oxbtn:disabled{cursor:default}
.oxbtn.dim{opacity:.45}
.oxbtn.answer{border-color:var(--good);background:var(--good-soft);opacity:1}
.oxbtn.answer .g{color:var(--good)}
.oxbtn.miss{border-color:var(--bad);background:var(--bad-soft);opacity:1}
.oxbtn.miss .g{color:var(--bad)}

.result{border-top:1px dashed var(--line);padding-top:18px;display:flex;flex-direction:column;gap:12px}
.verdict{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.verdict .chip{font-size:12px;font-weight:700;letter-spacing:.04em;padding:3px 10px;border-radius:999px}
.verdict.good{color:var(--good)}.verdict.good .chip{background:var(--good);color:var(--surface)}
.verdict.bad{color:var(--bad)}.verdict.bad .chip{background:var(--bad);color:var(--surface)}
.expl h3{margin:0 0 4px;font-size:12.5px;letter-spacing:.06em;color:var(--muted)}
.expl p{margin:0;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.basis{margin-top:8px!important;display:inline-block;font-size:13px;color:var(--accent);background:var(--accent-soft);padding:2px 10px;border-radius:6px}

.nav{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 16px;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:32px 20px;text-align:center;color:var(--muted);margin:0}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.hint kbd{font-family:var(--sans);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11.5px;background:var(--surface)}

/* admin */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0;font-size:17px;font-weight:700}
.note{margin:0;font-size:13px;color:var(--muted);background:var(--bg);border-radius:8px;padding:10px 12px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field textarea{font:inherit;font-size:15px;font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;resize:vertical}
.row2{display:grid;grid-template-columns:120px 1fr;gap:12px}
.ans{display:flex;gap:8px;border:0;padding:0;margin:0}
.ans legend{font-size:13px;font-weight:600;color:var(--muted);padding:0;margin-bottom:4px}
.ans label{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--line);border-radius:8px;padding:8px;font-weight:600;cursor:pointer}
.ans label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.ans input{position:absolute;opacity:0;pointer-events:none}
.ans .g{font-size:20px;line-height:1}
.formbtns{display:flex;gap:8px;flex-wrap:wrap}
.listhead{display:flex;justify-content:space-between;align-items:baseline}
.listhead span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.group{display:flex;flex-direction:column;gap:6px}
.group h3{margin:6px 0 2px;font-size:13px;letter-spacing:.04em;color:var(--accent)}
.item{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.item.editing{border-color:var(--accent);background:var(--accent-soft)}
.item .a{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:700}
.item .a.O{background:var(--good-soft);color:var(--good)}
.item .a.X{background:var(--bad-soft);color:var(--bad)}
.item .t{font-size:14px;word-break:keep-all;overflow-wrap:anywhere}
.item .t small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.item .acts{display:flex;gap:4px}
.item .acts .btn{padding:4px 10px;font-size:13px}
.savebar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px 10px 16px}
.savebar span{flex:1;min-width:160px;font-size:14px}
.savebar .btn.ghost{color:var(--bg);opacity:.8}
.msg{font-size:13.5px;border-radius:8px;padding:10px 12px;margin:0;background:var(--accent-soft);color:var(--ink)}
.msg.err{background:var(--bad-soft)}
@media (max-width:520px){
  .card{padding:18px}
  .qtext{font-size:18.5px}
  .row2{grid-template-columns:1fr}
  .item{grid-template-columns:28px 1fr}
  .item .acts{grid-column:2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<template id="shell">
<header class="top">
  <div class="brand">
    <div class="seal" aria-hidden="true">民</div>
    <div><h1>민법 OX</h1><p id="subtitle">주차별 OX 문제</p></div>
  </div>
  <nav class="modes" id="modes" hidden>
    <button type="button" data-mode="quiz" class="on">문제 풀기</button>
    <button type="button" data-mode="admin">문제 관리</button>
  </nav>
</header>

<section id="quizView" style="display:flex;flex-direction:column;gap:16px">
  <div class="weeks" id="weekList"></div>
  <div class="weekhead"><h2 id="weekTitle"></h2><div class="score" id="score"></div></div>
  <div class="dots" id="dots"></div>
  <article class="card" id="card">
    <div class="qmeta" id="qmeta"></div>
    <p class="qtext" id="qtext"></p>
    <div class="ox">
      <button type="button" class="oxbtn" data-pick="O" id="btnO"><span class="g">○</span><span class="l">맞다</span></button>
      <button type="button" class="oxbtn" data-pick="X" id="btnX"><span class="g">×</span><span class="l">틀리다</span></button>
    </div>
    <div class="result" id="result" hidden>
      <div class="verdict" id="verdict"></div>
      <div class="expl">
        <h3>해설</h3>
        <p id="expl"></p>
        <p class="basis" id="basis" hidden></p>
      </div>
    </div>
    <div class="nav">
      <button type="button" class="btn" id="prev">이전</button>
      <button type="button" class="btn ghost" id="retry">이 주차 다시 풀기</button>
      <button type="button" class="btn primary" id="next">다음 문제</button>
    </div>
  </article>
  <p class="empty" id="empty" hidden>아직 등록된 문제가 없어요.</p>
  <p class="hint">키보드: <kbd>O</kbd> <kbd>X</kbd> 로 답하고 <kbd>←</kbd> <kbd>→</kbd> 로 이동</p>
</section>

<section id="adminView" hidden style="flex-direction:column;gap:16px">
  <form class="panel" id="qform" novalidate>
    <h2 id="formTitle">새 문제 입력</h2>
    <p class="note">여기서 추가·수정한 내용은 아래 <b>저장하고 게시</b>를 눌러야 링크를 받은 모든 사람에게 반영돼요. 처음 들어 있는 문제는 예시이니 고치거나 지워서 쓰세요.</p>
    <div class="row2">
      <label class="field">주차<input id="fWeek" type="number" min="1" max="99" inputmode="numeric" required></label>
      <label class="field">주차 주제 (선택)<input id="fWeekTitle" type="text" placeholder="예: 법률행위와 의사표시"></label>
    </div>
    <label class="field">문제<textarea id="fText" rows="3" required placeholder="예: 통정허위표시의 무효는 선의의 제3자에게 대항할 수 있다."></textarea></label>
    <fieldset class="ans">
      <legend>정답</legend>
      <label><input type="radio" name="ans" value="O" id="fAnsO" checked><span class="g">○</span> 맞다</label>
      <label><input type="radio" name="ans" value="X" id="fAnsX"><span class="g">×</span> 틀리다</label>
    </fieldset>
    <label class="field">해설<textarea id="fExpl" rows="4" required placeholder="정답인 이유를 적어 주세요."></textarea></label>
    <label class="field">근거 조문·판례 (선택)<input id="fBasis" type="text" placeholder="예: 민법 제108조 제2항"></label>
    <p class="msg err" id="formErr" hidden></p>
    <div class="formbtns">
      <button type="submit" class="btn primary" id="fSubmit">목록에 추가</button>
      <button type="button" class="btn" id="fCancel" hidden>수정 취소</button>
    </div>
  </form>

  <div class="panel">
    <div class="listhead"><h2>등록된 문제</h2><span id="count"></span></div>
    <div id="qlist" style="display:flex;flex-direction:column;gap:14px"></div>
  </div>

  <p class="msg" id="pubMsg" hidden></p>
  <div class="savebar" id="savebar" hidden>
    <span id="dirtyMsg">저장하지 않은 변경이 있어요.</span>
    <button type="button" class="btn ghost" id="discard">되돌리기</button>
    <button type="button" class="btn primary" id="publish">저장하고 게시</button>
  </div>
</section>
</template>
<div id="root"></div>
<script type="application/json" id="quiz-data">{"weekTitles":{"1":"권리능력과 행위능력","2":"법률행위와 의사표시","3":"소멸시효"},"questions":[{"id":"s1","week":1,"text":"태아는 불법행위로 인한 손해배상청구권에 관하여는 이미 출생한 것으로 본다.","answer":"O","explanation":"민법은 태아의 권리능력을 원칙적으로 인정하지 않지만, 불법행위로 인한 손해배상청구권에 관하여는 이미 출생한 것으로 보는 개별적 보호주의를 취한다.","basis":"민법 제762조"},{"id":"s2","week":1,"text":"사람은 19세로 성년에 이른다.","answer":"O","explanation":"2013년 개정 민법 시행 이후 성년 연령은 20세에서 19세로 낮아졌다.","basis":"민법 제4조"},{"id":"s3","week":1,"text":"미성년자가 법정대리인의 동의 없이 한 법률행위는 무효이다.","answer":"X","explanation":"무효가 아니라 취소할 수 있는 법률행위이다. 취소하기 전까지는 유효하게 효력이 발생한다.","basis":"민법 제5조 제2항"},{"id":"s4","week":1,"text":"미성년자가 단순히 권리만을 얻거나 의무만을 면하는 행위는 법정대리인의 동의 없이 할 수 있다.","answer":"O","explanation":"미성년자에게 불이익이 없는 행위이므로 법정대리인의 동의가 필요하지 않다. 예컨대 부담 없는 증여를 받는 행위가 이에 해당한다.","basis":"민법 제5조 제1항 단서"},{"id":"s5","week":2,"text":"선량한 풍속 기타 사회질서에 위반한 사항을 내용으로 하는 법률행위는 무효이다.","answer":"O","explanation":"반사회질서의 법률행위는 절대적 무효로, 선의의 제3자에게도 무효를 주장할 수 있다.","basis":"민법 제103조"},{"id":"s6","week":2,"text":"상대방과 통정한 허위의 의사표시의 무효는 선의의 제3자에게 대항할 수 있다.","answer":"X","explanation":"통정허위표시는 당사자 사이에서는 무효이지만, 그 무효로 선의의 제3자에게 대항하지 못한다. 제3자의 선의는 추정된다.","basis":"민법 제108조 제2항"},{"id":"s7","week":2,"text":"진의 아닌 의사표시(비진의표시)는 원칙적으로 무효이다.","answer":"X","explanation":"비진의표시는 원칙적으로 유효하다. 다만 상대방이 표의자의 진의 아님을 알았거나 알 수 있었을 경우에만 무효가 된다.","basis":"민법 제107조 제1항"},{"id":"s8","week":2,"text":"사기나 강박에 의한 의사표시는 취소할 수 있다.","answer":"O","explanation":"사기·강박에 의한 의사표시는 취소할 수 있으며, 그 취소는 선의의 제3자에게 대항하지 못한다.","basis":"민법 제110조 제1항·제3항"},{"id":"s9","week":3,"text":"일반 민사채권의 소멸시효기간은 10년이다.","answer":"O","explanation":"채권은 10년간 행사하지 않으면 소멸시효가 완성한다. 채권 및 소유권 이외의 재산권은 20년이다.","basis":"민법 제162조"},{"id":"s10","week":3,"text":"소멸시효의 이익은 미리 포기할 수 있다.","answer":"X","explanation":"소멸시효의 이익은 미리 포기하지 못한다. 시효 완성 후의 포기는 가능하다.","basis":"민법 제184조 제1항"},{"id":"s11","week":3,"text":"소유권은 소멸시효에 걸리지 않는다.","answer":"O","explanation":"민법 제162조 제2항은 '채권 및 소유권 이외의 재산권'만 20년의 소멸시효에 걸린다고 규정하므로 소유권은 소멸시효의 대상이 아니다.","basis":"민법 제162조 제2항"}]}</script>
<script id="app-script">
(function () {
  "use strict";
  var SRC = {
    css: document.getElementById("app-style").textContent,
    shell: document.getElementById("shell").innerHTML,
    js: document.getElementById("app-script").textContent
  };
  var PUBLISHED = JSON.parse(document.getElementById("quiz-data").textContent);
  var data = clone(PUBLISHED);
  var dirty = false;

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function $(id) { return document.getElementById(id); }
  function store(kind, key, val) {
    try {
      var s = kind === "s" ? sessionStorage : localStorage;
      if (val === undefined) return s.getItem(key);
      if (val === null) s.removeItem(key); else s.setItem(key, val);
    } catch (e) { return null; }
  }

  // restore an unsent draft that was stashed right before a publish
  var stashed = store("s", "ox-draft");
  if (stashed) {
    store("s", "ox-draft", null);
    if (stashed !== JSON.stringify(PUBLISHED)) {
      try { data = JSON.parse(stashed); dirty = true; } catch (e) {}
    }
  }

  $("root").appendChild($("shell").content.cloneNode(true));

  var progress = {};
  try { progress = JSON.parse(store("l", "ox-progress") || "{}") || {}; } catch (e) {}
  function saveProgress() { store("l", "ox-progress", JSON.stringify(progress)); }

  var state = { mode: "quiz", week: null, idx: 0, editing: null };
  var canPublish = null; // artifact namespace when this viewer may publish

  function weeks() {
    var set = {};
    data.questions.forEach(function (q) { set[q.week] = true; });
    return Object.keys(set).map(Number).sort(function (a, b) { return a - b; });
  }
  function qsOf(w) { return data.questions.filter(function (q) { return q.week === w; }); }
  function weekLabel(w) { return w + "주차"; }
  function weekTitle(w) { return (data.weekTitles && data.weekTitles[w]) || ""; }

  // ---------- quiz ----------
  function renderQuiz() {
    var ws = weeks();
    var list = $("weekList");
    list.textContent = "";
    if (!ws.length) {
      $("card").hidden = true; $("empty").hidden = false;
      $("weekTitle").textContent = ""; $("score").textContent = ""; $("dots").textContent = "";
      return;
    }
    if (ws.indexOf(state.week) < 0) { state.week = ws[0]; state.idx = 0; }
    ws.forEach(function (w) {
      var qs = qsOf(w);
      var done = qs.filter(function (q) { return progress[q.id]; }).length;
      var b = document.createElement("button");
      b.type = "button"; b.className = "wk" + (w === state.week ? " on" : "");
      var t = document.createElement("b"); t.textContent = weekLabel(w);
      var s = document.createElement("small"); s.textContent = done + " / " + qs.length;
      b.append(t, s);
      b.onclick = function () { state.week = w; state.idx = firstUnsolved(w); renderQuiz(); };
      list.appendChild(b);
    });

    var qs = qsOf(state.week);
    if (state.idx >= qs.length) state.idx = qs.length - 1;
    var q = qs[state.idx];
    $("card").hidden = false; $("empty").hidden = true;

    var title = weekTitle(state.week);
    $("weekTitle").textContent = weekLabel(state.week) + (title ? " · " + title : "");
    var solved = 0, right = 0;
    qs.forEach(function (x) { if (progress[x.id]) { solved++; if (progress[x.id] === x.answer) right++; } });
    $("score").innerHTML = "";
    $("score").append("맞힌 문제 ");
    var bb = document.createElement("b"); bb.textContent = right + " / " + solved; $("score").append(bb);
    $("score").append(" · 전체 " + qs.length + "문제");

    var dots = $("dots"); dots.textContent = "";
    qs.forEach(function (x, i) {
      var d = document.createElement("button");
      d.type = "button"; d.className = "dot";
      var p = progress[x.id];
      if (p) d.className += p === x.answer ? " right" : " wrong";
      if (i === state.idx) d.className += " cur";
      d.textContent = i + 1;
      d.setAttribute("aria-label", (i + 1) + "번 문제");
      d.onclick = function () { state.idx = i; renderQuiz(); };
      dots.appendChild(d);
    });

    $("qmeta").textContent = "문제 " + (state.idx + 1) + " / " + qs.length;
    $("qtext").textContent = q.text;
    var pick = progress[q.id];
    ["O", "X"].forEach(function (v) {
      var btn = $("btn" + v);
      btn.className = "oxbtn";
      btn.disabled = !!pick;
      if (pick) {
        if (v === q.answer) btn.className += " answer";
        else if (v === pick) btn.className += " miss";
        else btn.className += " dim";
      }
    });
    $("result").hidden = !pick;
    if (pick) {
      var ok = pick === q.answer;
      var v = $("verdict"); v.textContent = ""; v.className = "verdict " + (ok ? "good" : "bad");
      var chip = document.createElement("span"); chip.className = "chip"; chip.textContent = ok ? "정답" : "오답";
      v.append(chip, ok ? "맞았어요" : "틀렸어요. 정답은 " + (q.answer === "O" ? "○" : "×") + " 입니다");
      $("expl").textContent = q.explanation;
      $("basis").hidden = !q.basis; $("basis").textContent = q.basis || "";
    }
    $("prev").disabled = state.idx === 0;
    var last = state.idx === qs.length - 1;
    var nextWeek = ws[ws.indexOf(state.week) + 1];
    $("next").hidden = last && nextWeek === undefined;
    $("next").textContent = last ? weekLabel(nextWeek) + "로" : "다음 문제";
  }

  function firstUnsolved(w) {
    var qs = qsOf(w);
    for (var i = 0; i < qs.length; i++) if (!progress[qs[i].id]) return i;
    return 0;
  }
  function answer(v) {
    var q = qsOf(state.week)[state.idx];
    if (!q || progress[q.id]) return;
    progress[q.id] = v; saveProgress(); renderQuiz();
  }
  function go(delta) {
    var qs = qsOf(state.week), ws = weeks();
    var n = state.idx + delta;
    if (n < 0) return;
    if (n >= qs.length) {
      var nw = ws[ws.indexOf(state.week) + 1];
      if (nw === undefined) return;
      state.week = nw; state.idx = firstUnsolved(nw);
    } else state.idx = n;
    renderQuiz();
  }
  $("btnO").onclick = function () { answer("O"); };
  $("btnX").onclick = function () { answer("X"); };
  $("prev").onclick = function () { go(-1); };
  $("next").onclick = function () { go(1); };
  $("retry").onclick = function () {
    qsOf(state.week).forEach(function (q) { delete progress[q.id]; });
    saveProgress(); state.idx = 0; renderQuiz();
  };
  document.addEventListener("keydown", function (e) {
    if (state.mode !== "quiz" || e.metaKey || e.ctrlKey || e.altKey) return;
    var tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea") return;
    var k = e.key.toLowerCase();
    if (k === "o") answer("O");
    else if (k === "x") answer("X");
    else if (e.key === "ArrowRight") go(1);
    else if (e.key === "ArrowLeft") go(-1);
  });

  // ---------- admin ----------
  function setMode(m) {
    state.mode = m;
    $("quizView").style.display = m === "quiz" ? "flex" : "none";
    $("adminView").hidden = m !== "admin";
    $("adminView").style.display = m === "admin" ? "flex" : "none";
    Array.prototype.forEach.call($("modes").children, function (b) {
      b.classList.toggle("on", b.getAttribute("data-mode") === m);
    });
    if (m === "admin") renderAdmin(); else renderQuiz();
  }
  Array.prototype.forEach.call($("modes").children, function (b) {
    b.onclick = function () { setMode(b.getAttribute("data-mode")); };
  });

  function renderAdmin() {
    $("count").textContent = "총 " + data.questions.length + "문제";
    var box = $("qlist"); box.textContent = "";
    var ws = weeks();
    if (!ws.length) {
      var p = document.createElement("p"); p.className = "hint"; p.textContent = "아직 문제가 없어요. 위에서 첫 문제를 입력해 보세요.";
      box.appendChild(p);
    }
    ws.forEach(function (w) {
      var g = document.createElement("div"); g.className = "group";
      var h = document.createElement("h3");
      h.textContent = weekLabel(w) + (weekTitle(w) ? " · " + weekTitle(w) : "");
      g.appendChild(h);
      qsOf(w).forEach(function (q) {
        var it = document.createElement("div");
        it.className = "item" + (state.editing === q.id ? " editing" : "");
        var a = document.createElement("span"); a.className = "a " + q.answer; a.textContent = q.answer === "O" ? "○" : "×";
        var t = document.createElement("div"); t.className = "t"; t.textContent = q.text;
        var sm = document.createElement("small"); sm.textContent = q.basis || "근거 조문 없음"; t.appendChild(sm);
        var acts = document.createElement("div"); acts.className = "acts";
        var ed = document.createElement("button"); ed.type = "button"; ed.className = "btn"; ed.textContent = "수정";
        ed.onclick = function () { startEdit(q.id); };
        var del = document.createElement("button"); del.type = "button"; del.className = "btn danger"; del.textContent = "삭제";
        del.onclick = function () {
          if (!del.classList.contains("armed")) {
            del.classList.add("armed"); del.textContent = "정말 삭제";
            setTimeout(function () { del.classList.remove("armed"); del.textContent = "삭제"; }, 3000);
            return;
          }
          data.questions = data.questions.filter(function (x) { return x.id !== q.id; });
          if (state.editing === q.id) resetForm();
          markDirty();
        };
        acts.append(ed, del);
        it.append(a, t, acts);
        g.appendChild(it);
      });
      box.appendChild(g);
    });
    $("savebar").hidden = !dirty;
  }

  function resetForm(keepWeek) {
    var w = keepWeek || (weeks().slice(-1)[0] || 1);
    state.editing = null;
    $("fWeek").value = w;
    $("fWeekTitle").value = weekTitle(w);
    $("fText").value = ""; $("fExpl").value = ""; $("fBasis").value = "";
    $("fAnsO").checked = true;
    $("formTitle").textContent = "새 문제 입력";
    $("fSubmit").textContent = "목록에 추가";
    $("fCancel").hidden = true;
    $("formErr").hidden = true;
  }
  function startEdit(id) {
    var q = data.questions.filter(function (x) { return x.id === id; })[0];
    if (!q) return;
    state.editing = id;
    $("fWeek").value = q.week; $("fWeekTitle").value = weekTitle(q.week);
    $("fText").value = q.text; $("fExpl").value = q.explanation; $("fBasis").value = q.basis || "";
    $("fAns" + q.answer).checked = true;
    $("formTitle").textContent = "문제 수정";
    $("fSubmit").textContent = "수정 반영";
    $("fCancel").hidden = false;
    $("formErr").hidden = true;
    renderAdmin();
    $("qform").scrollIntoView({ behavior: "smooth", block: "start" });
  }
  $("fWeek").addEventListener("change", function () {
    var w = parseInt($("fWeek").value, 10);
    if (w && weekTitle(w)) $("fWeekTitle").value = weekTitle(w);
  });
  $("fCancel").onclick = function () { resetForm(); renderAdmin(); };
  $("qform").addEventListener("submit", function (e) {
    e.preventDefault();
    var w = parseInt($("fWeek").value, 10);
    var text = $("fText").value.trim(), expl = $("fExpl").value.trim();
    var err = !(w >= 1 && w <= 99) ? "주차를 1~99 사이 숫자로 입력해 주세요."
      : !text ? "문제를 입력해 주세요." : !expl ? "해설을 입력해 주세요." : "";
    if (err) { $("formErr").textContent = err; $("formErr").hidden = false; return; }
    var q = {
      id: state.editing || "q" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      week: w, text: text,
      answer: $("fAnsX").checked ? "X" : "O",
      explanation: expl, basis: $("fBasis").value.trim()
    };
    if (state.editing) {
      data.questions = data.questions.map(function (x) { return x.id === q.id ? q : x; });
    } else data.questions.push(q);
    data.weekTitles = data.weekTitles || {};
    var wt = $("fWeekTitle").value.trim();
    if (wt) data.weekTitles[w] = wt; else delete data.weekTitles[w];
    resetForm(w);
    markDirty();
  });

  function markDirty() {
    dirty = JSON.stringify(data) !== JSON.stringify(PUBLISHED);
    $("pubMsg").hidden = true;
    renderAdmin();
  }
  $("discard").onclick = function () { data = clone(PUBLISHED); resetForm(); markDirty(); };
  window.addEventListener("beforeunload", function (e) { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

  function showMsg(text, isErr) {
    var m = $("pubMsg"); m.textContent = text; m.className = "msg" + (isErr ? " err" : ""); m.hidden = false;
  }

  function buildDocument() {
    var reset = "";
    var hs = document.head && document.head.querySelector("style");
    if (hs) reset = hs.textContent;
    var json = JSON.stringify(data).replace(/</g, "\\u003c");
    var fonts = '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">';
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>' +
      '<title>민법 OX 퀴즈<\/title>\n' + fonts + '\n<style id="app-style">' + SRC.css + '<\/style>\n' +
      '<template id="shell">' + SRC.shell + '<\/template>\n<div id="root"><\/div>\n' +
      '<script type="application/json" id="quiz-data">' + json + '<\/script>\n' +
      '<script id="app-script">' + SRC.js + '<\/script>\n</body></html>';
  }

  $("publish").onclick = function () {
    var btn = $("publish");
    if (!canPublish) {
      showMsg("이 화면에서는 게시할 수 없어요. claude.ai에서 이 페이지의 소유자로 열어 주세요.", true);
      return;
    }
    btn.disabled = true; btn.textContent = "게시 중…";
    store("s", "ox-draft", JSON.stringify(data));
    canPublish.publish(buildDocument()).then(function () {
      dirty = false; // the view reloads to the new version
      btn.textContent = "게시됨";
    }, function (e) {
      btn.disabled = false; btn.textContent = "저장하고 게시";
      var code = e && e.code;
      if (code === "conflict") { showMsg("다른 곳에서 먼저 저장된 버전이 있어 새로 불러옵니다. 작성 중이던 내용은 복원돼요."); return; }
      store("s", "ox-draft", null);
      if (code === "not_writer" || code === "not_granted" || code === "not_declared" || code === "consent_required" || code === "capability_disabled" || code === "capability_removed") {
        canPublish = null;
        showMsg("이 계정은 보기 권한만 있어서 게시할 수 없어요.", true);
      } else if (code === "rate_limited") showMsg("너무 자주 게시했어요. 잠시 후 다시 눌러 주세요.", true);
      else if (code === "too_large") showMsg("문제 수가 너무 많아 한 페이지에 담을 수 없어요. 일부를 지워 주세요.", true);
      else showMsg("게시하지 못했어요. 잠시 후 다시 시도해 주세요.", true);
    });
  };

  // ---------- boot ----------
  resetForm();
  setMode("quiz");
  if (location.hash === "#admin") $("modes").hidden = false;

  var C = window.claude;
  if (C && typeof C.use === "function") {
    Promise.all([C.use("user"), C.use("artifact")]).then(function (r) {
      var user = r[0], art = r[1];
      if (!user || !art) return;
      return user.canEdit().then(function (ok) {
        if (!ok) return;
        canPublish = art;
        $("modes").hidden = false;
        if (dirty) { setMode("admin"); showMsg("게시되지 않은 변경 내용을 복원했어요."); }
      });
    }).catch(function () {});
  }
})();
</script>
